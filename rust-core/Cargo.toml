[package]
name = "wt_idevice_ffi"
version = "0.1.0"
edition = "2021"
description = "WorkTweaks JIT transport: a staticlib shim re-exporting idevice's C FFI (RPPairing tunnel + RSD services) for the Install IPA on Container JIT session"

[lib]
name = "wt_idevice_ffi"
crate-type = ["staticlib"]

[dependencies]
# idevice's own C-FFI crate, vendored under vendor/idevice-ffi (jkcoxson/idevice
# @ 7bd551c16c6dd2e058740d85a2d9399a51a776e9, the same revision SideInstaller
# v2.2.0 ships). Only the features the JIT session needs — see README.md.
# `full` is deliberately NOT enabled: every extra feature pulls another
# service's dep tree into the staticlib.
idevice-ffi = { path = "vendor/idevice-ffi", default-features = false, features = [
  "aws-lc",
  "amfi",
  "core_device",
  "core_device_proxy",
  "debug_proxy",
  "dvt",
  "heartbeat",
  "mobile_image_mounter",
  "remote_pairing",
  "rsd",
  "tunnel_tcp_stack",
  "xpc",
] }

# idevice-ffi's `idevice` dependency points at the pinned git revision; this
# patch redirects it (and any other `idevice` git dependency) to the vendored
# copy, so cargo builds exactly one `idevice` instance. Mirrors
# SideInstaller's rust-core/Cargo.toml. The vendored copy carries
# SideInstaller's local fixes (OPACK back-references, etc.) — see
# vendor/idevice/README.md.
[patch."https://github.com/jkcoxson/idevice.git"]
idevice = { path = "vendor/idevice" }

[profile.release]
opt-level = 3
lto = "thin"
