name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch AirliftFFI
        run: |
          set -euo pipefail
          # The 65 MB static library is not stored in this repo.
          # Download the device slice (pinned to aircard-ios 40640c4d)
          # so the pbxproj's AirliftFFI.xcframework reference resolves.
          mkdir -p worse_query/AirliftFFI.xcframework/ios-arm64
          curl -sL -o worse_query/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a \
            "https://raw.githubusercontent.com/adnan120hz/aircard-ios/40640c4d827aeab8d798285b57d24fcf6be070d0/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a"
          ls -lh worse_query/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a

      - name: Fetch OpenSSL
        run: |
          set -euo pipefail
          # ZSign needs OpenSSL headers + lib at compile time.
          # Pinned to krzyzanowskim/OpenSSL 3.6.5000, matching
          # LiveContainer's prepare_dependencies.sh pattern
          # (curl -LO .../OpenSSL.xcframework.zip, unzip, move to
          # Dependencies/OpenSSL.xcframework).
          mkdir -p Dependencies
          curl -sL -o /tmp/OpenSSL.xcframework.zip "https://github.com/krzyzanowskim/OpenSSL/releases/download/3.6.5000/OpenSSL.xcframework.zip"
          unzip -q -o /tmp/OpenSSL.xcframework.zip -d Dependencies
          rm /tmp/OpenSSL.xcframework.zip
          ls Dependencies/OpenSSL.xcframework/ios-arm64/OpenSSL.framework/Headers/opensslv.h

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -project worse_query.xcodeproj -list

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project worse_query.xcodeproj \
            -scheme worse_query \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Build TweakLoader.dylib
        run: |
          set -euo pipefail
          # The guest-side loader dylib. Its 5 sources carry
          # __attribute__((constructor)) hooks that must run inside
          # the GUEST, never inside WorkTweaks, so they are excluded
          # from the app target (pbxproj exception set) and built
          # here as a separate dylib. -undefined dynamic_lookup lets
          # its references to the host's LC symbols (utils,
          # LCSharedUtils categories) resolve at dlopen time.
          # It is unsigned in CI; the user's signing flow signs the
          # whole bundle (including Frameworks/) at install time.
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          mkdir -p "$APP_PATH/Frameworks"
          clang -dynamiclib -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -fobjc-arc -fmodules \
            -I worse_query/LiveContainerCore/LiveContainer \
            -I worse_query/LiveContainerCore/litehook/src \
            -I worse_query/LiveContainerCore/litehook/external/include \
            -framework Foundation -framework UIKit -framework UniformTypeIdentifiers \
            -framework LocalAuthentication -framework UserNotifications -framework Security \
            -undefined dynamic_lookup \
            -install_name @rpath/TweakLoader.dylib \
            worse_query/LiveContainerCore/TweakLoader/*.m \
            -o "$APP_PATH/Frameworks/TweakLoader.dylib"
          ls -lh "$APP_PATH/Frameworks/TweakLoader.dylib"

      - name: Embed OpenSSL.framework
        run: |
          set -euo pipefail
          # ZSign links OpenSSL dynamically (@rpath/OpenSSL.framework/OpenSSL).
          # The linker finds it via FRAMEWORK_SEARCH_PATHS at build time,
          # but dyld needs the framework inside the bundle at launch:
          # b3ae457e shipped without it and force-closed at launch
          # ("Library not loaded: @rpath/OpenSSL.framework/OpenSSL").
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          mkdir -p "$APP_PATH/Frameworks"
          cp -R Dependencies/OpenSSL.xcframework/ios-arm64/OpenSSL.framework "$APP_PATH/Frameworks/OpenSSL.framework"
          ls -lh "$APP_PATH/Frameworks/OpenSSL.framework/OpenSSL"
          file "$APP_PATH/Frameworks/OpenSSL.framework/OpenSSL"
          otool -L "$APP_PATH/worse_query" | grep -F OpenSSL || true

      - name: Inject Info.plist keys
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          PLIST="$APP_PATH/Info.plist"
          echo "Injecting into $PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSBonjourServices" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string _remotepairing-pairable-host._tcp" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:1 string _worktweaksprobe._tcp" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"
          # Install IPA on Container (Phase 1, LiveContainer host):
          # LC's background modes beyond audio, the livecontainer
          # URL scheme, and the schemes WorkTweaks may open.
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:1 string bluetooth-central" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:2 string external-accessory" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:3 string fetch" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:4 string location" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string LiveContainer" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string livecontainer" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string sidestore" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string livecontainer" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:2 string livecontainer2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:3 string livecontainer3" "$PLIST"
          # Alternate app icons (v7.0 language themes): the
          # recolored 1024x1024 PNGs live at the bundle root
          # (worse_query/AppIcon-{ID,CN,VN,RU}.png, auto-included
          # by the synchronized group). en-US uses the primary
          # (blue) icon, so it needs no alternate entry.
          # CFBundleIcons is generated by Xcode from the asset
          # catalog; create it only if it is missing.
          if /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons:CFBundleAlternateIcons" "$PLIST" 2>/dev/null || true
          else
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" "$PLIST"
          fi
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons dict" "$PLIST"
          for ALT in ID CN VN RU; do
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:AppIcon-$ALT dict" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:AppIcon-$ALT:CFBundleIconFiles array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:AppIcon-$ALT:CFBundleIconFiles:0 string AppIcon-$ALT" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:AppIcon-$ALT:UIPrerenderedIcon bool false" "$PLIST"
          done
          /usr/libexec/PlistBuddy -c "Print :NSBonjourServices" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :LSApplicationQueriesSchemes" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundleAlternateIcons" "$PLIST"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in build products" >&2
            exit 1
          fi
          echo "Packaging $APP_PATH"
          rm -rf Payload WorkTweaks-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry WorkTweaks-unsigned.ipa Payload
          ls -lh WorkTweaks-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkTweaks-unsigned-ipa
          path: WorkTweaks-unsigned.ipa
          if-no-files-found: error
