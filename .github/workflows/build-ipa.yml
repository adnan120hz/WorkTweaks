name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch AirliftFFI
        run: |
          set -euo pipefail
          # The 65 MB static library is not stored in this repo.
          # Download the device slice (pinned to aircard-ios 40640c4d)
          # so the pbxproj's AirliftFFI.xcframework reference resolves.
          mkdir -p worse_query/AirliftFFI.xcframework/ios-arm64
          curl -sL -o worse_query/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a \
            "https://raw.githubusercontent.com/adnan120hz/aircard-ios/40640c4d827aeab8d798285b57d24fcf6be070d0/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a"
          ls -lh worse_query/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -project worse_query.xcodeproj -list

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project worse_query.xcodeproj \
            -scheme worse_query \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Inject pairing Info.plist keys
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          PLIST="$APP_PATH/Info.plist"
          echo "Injecting into $PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSBonjourServices" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string _remotepairing-pairable-host._tcp" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:1 string _worktweaksprobe._tcp" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"
          # Alternate app icons (v7.0 language themes): the
          # recolored 1024x1024 PNGs live at the bundle root
          # (worse_query/AppIcon-{ID,CN,VN}.png, auto-included
          # by the synchronized group). en-US uses the primary
          # (blue) icon, so it needs no alternate entry.
          # CFBundleIcons is generated by Xcode from the asset
          # catalog; create it only if it is missing.
          if /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons:CFBundleAlternateIcons" "$PLIST" 2>/dev/null || true
          else
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" "$PLIST"
          fi
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons dict" "$PLIST"
          for ALT in ID CN VN; do
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:AppIcon-$ALT dict" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:AppIcon-$ALT:CFBundleIconFiles array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:AppIcon-$ALT:CFBundleIconFiles:0 string AppIcon-$ALT" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:AppIcon-$ALT:UIPrerenderedIcon bool false" "$PLIST"
          done
          /usr/libexec/PlistBuddy -c "Print :NSBonjourServices" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundleAlternateIcons" "$PLIST"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in build products" >&2
            exit 1
          fi
          echo "Packaging $APP_PATH"
          rm -rf Payload WorkTweaks-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry WorkTweaks-unsigned.ipa Payload
          ls -lh WorkTweaks-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkTweaks-unsigned-ipa
          path: WorkTweaks-unsigned.ipa
          if-no-files-found: error
