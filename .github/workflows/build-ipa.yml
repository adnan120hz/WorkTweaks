name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build IPA
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -project worse_query.xcodeproj -list

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project worse_query.xcodeproj \
            -scheme worse_query \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Ad-hoc sign with entitlements
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in build products" >&2
            exit 1
          fi
          # Ad-hoc sign the app with its App Group entitlements embedded,
          # like GestaltX does: re-signing tools (AltStore/SideStore) read
          # the entitlements from the existing signature to decide which
          # App Groups to register, so a fully unsigned IPA ends up
          # without an App Group. The signature stays ad-hoc with no
          # developer Team ID; installers replace it when they re-sign.
          echo "Ad-hoc signing $APP_PATH"
          codesign -f -s - --entitlements worse_query/worse_query.entitlements "$APP_PATH"
          codesign --verify --strict "$APP_PATH"
          codesign -d --entitlements - "$APP_PATH"
          codesign -dvv "$APP_PATH" 2>&1 | tee /tmp/codesign-info.txt
          grep -q "Signature=adhoc" /tmp/codesign-info.txt
          grep -q "TeamIdentifier=not set" /tmp/codesign-info.txt
          codesign -d --entitlements - --xml "$APP_PATH" | grep -q "group.cc.forcequit.worse-query"
          echo "Ad-hoc signature verified: App Group entitlements embedded, no Team ID"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in build products" >&2
            exit 1
          fi
          echo "Packaging $APP_PATH"
          rm -rf Payload WorkTweaks-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry WorkTweaks-unsigned.ipa Payload
          ls -lh WorkTweaks-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkTweaks-unsigned-ipa
          path: WorkTweaks-unsigned.ipa
          if-no-files-found: error
